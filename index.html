<style>
:root {
  --bg: #111318;
  --bg2: #1c1f27;
  --bg3: #252930;
  --bg4: #2e3240;
  --fg: #f0f2f5;
  --fg2: #9aa0b2;
  --fg3: #5a6070;
  --border: #2e3240;

  --green: #2ecc71;
  --green-bg: rgba(46,204,113,.15);
  --orange: #e8843a;
  --orange-bg: rgba(232,132,58,.18);
  --gray: #6b7280;
  --gray-bg: rgba(107,114,128,.18);
  --red: #e84b2c;
  --red-bg: rgba(232,75,44,.18);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,.18);

  --radius: 14px;
  --radius-sm: 10px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  max-width: 480px;
  margin: 0 auto;
}

/* ── HERO / COUNTDOWN ── */
.hero {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.countdown-bar {
  width: 48px; height: 4px;
  background: var(--red);
  border-radius: 2px;
  margin-bottom: 10px;
}
.countdown-label { font-size: .78rem; color: var(--fg2); margin-bottom: 2px; }
.countdown-race {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--fg);
  margin-bottom: 12px;
}
.countdown-days {
  display: flex;
  gap: 10px;
  align-items: baseline;
  flex-wrap: wrap;
}
.countdown-num {
  font-size: 2.8rem;
  font-weight: 800;
  line-height: 1;
  color: var(--fg);
  letter-spacing: -.04em;
}
.countdown-unit { font-size: .8rem; color: var(--fg2); }
.today-line {
  margin-top: 12px;
  font-size: .85rem;
  color: var(--fg2);
}
.today-line strong { color: var(--fg); }

/* ── TABS ── */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  padding: 12px 20px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  background: transparent;
  color: var(--fg2);
}
.tab-btn.active {
  background: var(--green);
  color: #0a1a0f;
}

/* ── WEEK NAV ── */
.week-nav {
  padding: 14px 20px 8px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.week-nav::-webkit-scrollbar { display: none; }
.week-pill {
  flex-shrink: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--fg2);
  transition: all .2s;
  white-space: nowrap;
}
.week-pill.active {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
}
.week-pill.current { border-color: var(--green); }

/* ── HYDRO LEGEND ── */
.hydro-legend {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 20px 12px;
  font-size: .72rem;
  color: var(--fg2);
  border-bottom: 1px solid var(--border);
}
.hydro-tag {
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 700;
  font-size: .68rem;
  letter-spacing: .03em;
}
.tag-alto { background: var(--green-bg); color: var(--green); }
.tag-medio { background: var(--orange-bg); color: var(--orange); }
.tag-bajo { background: var(--gray-bg); color: var(--gray); }
.tag-carga { background: var(--red-bg); color: var(--red); }
.tag-carrera { background: var(--blue-bg); color: var(--blue); }

/* ── DAY LIST ── */
.day-list { padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; }

.day-row {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.day-row:hover { border-color: var(--fg3); background: var(--bg3); }
.day-row.today-row { border-color: var(--green); }
.day-row.expanded { border-color: var(--fg3); border-radius: var(--radius) var(--radius) 0 0; }

.day-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 36px;
}
.day-abbr { font-size: .65rem; font-weight: 600; color: var(--fg3); letter-spacing: .06em; text-transform: uppercase; }
.day-num-big {
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.1;
  color: var(--fg);
  letter-spacing: -.03em;
}
.day-row.today-row .day-num-big { color: var(--green); }

.day-info { flex: 1; min-width: 0; }
.day-session {
  font-size: .95rem;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.day-session.race-session { color: var(--red); }
.day-hydro { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.day-arrow {
  color: var(--fg3);
  font-size: .8rem;
  transition: transform .2s;
  flex-shrink: 0;
}
.day-row.expanded .day-arrow { transform: rotate(90deg); }

/* ── EXPANDED DETAIL ── */
.day-detail {
  display: none;
  background: var(--bg3);
  border: 1px solid var(--fg3);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 16px;
  margin-top: -6px;
  margin-bottom: 0;
}
.day-detail.open { display: block; }

/* Training tab */
.training-detail h4 {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg3);
  margin-bottom: 10px;
}
.training-block {
  background: var(--bg4);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.training-block:last-child { margin-bottom: 0; }
.training-block-label {
  font-size: .7rem;
  font-weight: 700;
  color: var(--fg3);
  margin-bottom: 4px;
  letter-spacing: .05em;
}
.training-block-content {
  font-size: .88rem;
  color: var(--fg);
  line-height: 1.5;
}

/* Nutrition tab */
.meal-card {
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  border-left: 3px solid;
}
.meal-card:last-child { margin-bottom: 0; }
.mc-desat { background: rgba(46,160,80,.1); border-color: #2ea050; }
.mc-mm    { background: rgba(139,92,246,.1); border-color: #8b5cf6; }
.mc-comida { background: rgba(245,158,11,.1); border-color: #f59e0b; }
.mc-cena  { background: rgba(59,130,246,.1); border-color: #3b82f6; }

.meal-card-label {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.mcl-desat  { color: #2ea050; }
.mcl-mm     { color: #8b5cf6; }
.mcl-comida { color: #f59e0b; }
.mcl-cena   { color: #3b82f6; }

.meal-card-content { font-size: .86rem; color: var(--fg); line-height: 1.5; }
.meal-card-note { font-size: .74rem; color: var(--fg2); margin-top: 4px; font-style: italic; }

/* ── HYDRO NOTE ── */
.hydro-note {
  font-size: .78rem;
  color: var(--fg2);
  padding: 8px 12px;
  background: var(--bg4);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  line-height: 1.5;
}

/* ── EDITABLE FIELDS ── */
.train-textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: .86rem;
  line-height: 1.5;
  padding: 10px 12px;
  resize: vertical;
  min-height: 80px;
  margin-top: 4px;
  transition: border-color .15s;
  -webkit-appearance: none;
}
.train-textarea:focus {
  outline: none;
  border-color: var(--green);
}
.train-textarea::placeholder { color: var(--fg3); font-style: italic; }
.train-saved {
  font-size: .68rem;
  color: var(--green);
  margin-top: 4px;
  opacity: 0;
  transition: opacity .3s;
}
.train-saved.show { opacity: 1; }

/* ── FOOTER ── */
.footer {
  padding: 20px;
  text-align: center;
  font-size: .72rem;
  color: var(--fg3);
  border-top: 1px solid var(--border);
  margin-top: 8px;
}
</style>
</head>

  {
    lun:{ de:"Tostada integral + 2 huevos + aguacate", mm:"Avena + kéfir + plátano", co:"Lentejas con verduras + arroz", ce:"Salmón al horno + espinacas + patata" },
    mar:{ de:"Tostada integral + pavo + tomate", mm:"Avena + yogur griego + kiwi", co:"Pasta integral con pesto y pollo (ración generosa)", ce:"Merluza + judías verdes + boniato" },
    mie:{ de:"Tostada integral + salmón + queso fresco", mm:"Avena + kéfir + fresas", co:"Arroz con pollo + pimiento y cúrcuma", ce:"Pechuga de pavo + espinacas + zanahoria" },
    jue:{ de:"Tostada integral + 2 huevos + tomate", mm:"Avena + yogur + naranja", co:"Garbanzos con espinacas + pan integral (ración generosa)", ce:"Pollo + champiñones + patata cocida" },
    vie:{ de:"Tostada integral + aguacate + jamón", mm:"Avena + kéfir + pera", co:"Quinoa con gambas y aguacate", ce:"Atún a la plancha + ensalada verde + boniato" },
    sab:{ de:"Tostada integral + 2 huevos + tomate", mm:"Avena + yogur + frutos del bosque", co:"Merluza en salsa verde + patatas (ración grande)", ce:"Ensalada de pollo + 1 huevo duro + tostada" },
    dom:{ de:"Huevos con tostada + tomate", mm:"Fruta de temporada + mix de nueces", co:"Pollo al horno con verduras + patatas", ce:"Crema de verduras + queso fresco" },
  }
];

const KEYS = ['lun','mar','mie','jue','vie','sab','dom'];

// Hydro notes per type
const HYDRO_NOTES = {
  alto:   "🔥 Día de series — raciones generosas de hidratos en COMIDA y CENA para recuperación post-entreno.",
  medio:  "💪 Entrenamiento de fuerza — hidratos moderados. Cena con carbohidrato para recuperar músculo durante la noche.",
  bajo:   "😴 Descanso — déficit calórico controlado. Cena ligera, solo proteína y verdura.",
  carga:  "⚡ Trabajo Hyrox (mañana) — máxima carga de hidratos en COMIDA de mediodía para recuperar la sesión matutina. Cena ligera.",
  carrera:"🏁 Día de carrera — protocolo de carga. Desayuno rico en hidratos, pasta o arroz en comida.",
};

const CENA_NOTES = {
  alto:   "Hidratos post-entreno de series para recuperación muscular nocturna.",
  medio:  "Hidratos moderados post-fuerza para recuperación nocturna.",
  bajo:   "Solo proteína + verdura. Déficit controlado.",
  carga:  "Cena ligera — la recuperación ya se hizo en la comida del mediodía.",
  carrera:"Ligera noche de carrera.",
};

// ── STATE ──
let activeTab = 'nutri';
let currentWeekStart = null; // Monday of current displayed week
let expandedRow = null;

// ── HELPERS ──
function weekStart(d) {
  const r = new Date(d);
  r.setDate(r.getDate() - dow(r));
  r.setHours(0,0,0,0);
  return r;
}
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function weekNum(d) {
  const mon = weekStart(d);
  return Math.floor((mon - PLAN_START)/86400000/7);
}
function cycleIdx(d) { return ((weekNum(d)%4)+4)%4; }

function getMeal(d) {
  const k = KEYS[dow(d)];
  const cyc = cycleIdx(d);
  return WEEKS[cyc][k];
}

function inPlan(d) { return d >= PLAN_START && d <= PLAN_END; }

// ── COUNTDOWN ──
function updateCountdown() {
  const diff = Math.ceil((RACE_DATE - TODAY)/86400000);
  const weeks = Math.floor(diff/7);
  const days  = diff % 7;
  document.getElementById('cdDays').textContent  = diff > 0 ? diff : 0;
  document.getElementById('cdWeeks').textContent = diff > 0 ? weeks : 0;

  const cfg = DAY_CONFIG[dow(TODAY)];
  const todayInPlan = inPlan(TODAY);
  let todayStr = '';
  if (todayInPlan && cfg) {
    todayStr = `Hoy · <strong>${cfg.session}</strong> — ${cfg.detail}`;
  } else {
    todayStr = `Hoy · ${TODAY.getDate()} de ${MONTHS_ES[TODAY.getMonth()]}`;
  }
  document.getElementById('todayLine').innerHTML = todayStr;
}

// ── WEEK NAV ──
function buildWeekNav() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  // collect all weeks in plan
  const weeks = [];
  let d = new Date(PLAN_START);
  while (d <= PLAN_END) {
    weeks.push(new Date(d));
    d = addDays(d, 7);
  }
  weeks.forEach((mon, i) => {
    const pill = document.createElement('button');
    pill.className = 'week-pill';
    const mon2 = addDays(mon, 6);
    const label = `Sem ${i+1}`;
    const dates = `${mon.getDate()}–${mon2.getDate()} ${MONTHS_CAP[mon2.getMonth()].slice(0,3).toLowerCase()}`;
    pill.innerHTML = `<span style="font-size:.85em;font-weight:800">${label}</span><br><span style="font-size:.68em;font-weight:400;color:var(--fg3)">${dates}</span>`;
    pill.style.lineHeight = '1.3';
    pill.style.paddingBlock = '8px';
    // mark current week
    const ws = weekStart(TODAY);
    if (mon.getTime() === ws.getTime()) pill.classList.add('current');
    pill.onclick = () => selectWeek(mon, pill);
    pill.dataset.idx = i;
    nav.appendChild(pill);
  });
}

function selectWeek(mon, pill) {
  currentWeekStart = mon;
  document.querySelectorAll('.week-pill').forEach(p => p.classList.remove('active'));
  if (pill) pill.classList.add('active');
  expandedRow = null;
  renderDays();
  // scroll pill into view
  if (pill) pill.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

// ── RENDER DAYS ──
function renderDays() {
  const list = document.getElementById('dayList');
  list.innerHTML = '';

  for (let i=0; i<7; i++) {
    const d = addDays(currentWeekStart, i);
    if (!inPlan(d)) continue;

    const isToday = d.getTime() === TODAY.getTime();
    const cfg = DAY_CONFIG[i];
    const meal = getMeal(d);
    const train = TRAIN_NOTES[i];

    // ROW
    const row = document.createElement('div');
    row.className = 'day-row' + (isToday ? ' today-row' : '');
    row.dataset.idx = i;

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'day-label';
    lbl.innerHTML = `<span class="day-abbr">${DAY_ABBR[i]}</span><span class="day-num-big">${d.getDate()}</span>`;

    // Info
    const info = document.createElement('div');
    info.className = 'day-info';
    const sessionName = document.createElement('div');
    sessionName.className = 'day-session';
    sessionName.textContent = cfg.session;
    const hydroDiv = document.createElement('div');
    hydroDiv.className = 'day-hydro';
    hydroDiv.innerHTML = `<span class="hydro-tag tag-${cfg.hydro}">${cfg.hydroLabel}</span>`;
    if (isToday) hydroDiv.innerHTML += `<span style="font-size:.68rem;color:var(--green);font-weight:600">● Hoy</span>`;
    info.appendChild(sessionName);
    info.appendChild(hydroDiv);

    const arrow = document.createElement('span');
    arrow.className = 'day-arrow';
    arrow.textContent = '▶';

    row.appendChild(lbl);
    row.appendChild(info);
    row.appendChild(arrow);

    // DETAIL
    const detail = document.createElement('div');
    detail.className = 'day-detail';
    detail.dataset.idx = i;

    if (activeTab === 'nutri') {
      detail.innerHTML = buildNutriDetail(meal, cfg, d);
    } else {
      detail.innerHTML = buildTrainDetail(train, cfg, d);
    }

    row.addEventListener('click', () => {
      const isOpen = detail.classList.contains('open');
      // close all
      document.querySelectorAll('.day-detail').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.day-row').forEach(r => r.classList.remove('expanded'));
      if (!isOpen) {
        detail.classList.add('open');
        row.classList.add('expanded');
        expandedRow = i;
        setTimeout(()=>{
          detail.scrollIntoView({behavior:'smooth',block:'nearest'});
          if (activeTab === 'train') {
            const dateKey = d.toISOString().slice(0,10);
            attachTrainListeners(dateKey);
          }
        },100);
      } else {
        expandedRow = null;
      }
    });

    list.appendChild(row);
    list.appendChild(detail);
  }
}

function buildNutriDetail(meal, cfg, d) {
  const hn = HYDRO_NOTES[cfg.hydro] || '';
  const cn = CENA_NOTES[cfg.hydro] || '';
  return `
    <div class="hydro-note">${hn}</div>
    <div class="meal-card mc-desat">
      <div class="meal-card-label mcl-desat">☀ Desayuno</div>
      <div class="meal-card-content">${meal.de}</div>
    </div>
    <div class="meal-card mc-mm">
      <div class="meal-card-label mcl-mm">🌿 Media Mañana</div>
      <div class="meal-card-content">${meal.mm}</div>
    </div>
    <div class="meal-card mc-comida">
      <div class="meal-card-label mcl-comida">🍽 Comida</div>
      <div class="meal-card-content">${meal.co}</div>
      ${cfg.hydro==='alto'||cfg.hydro==='carga' ? '<div class="meal-card-note">Ración generosa de hidratos.</div>' : ''}
    </div>
    <div class="meal-card mc-cena">
      <div class="meal-card-label mcl-cena">🌙 Cena</div>
      <div class="meal-card-content">${meal.ce}</div>
      <div class="meal-card-note">${cn}</div>
    </div>
  `;
}

function buildTrainDetail(train, cfg, d) {
  const dateKey = d.toISOString().slice(0,10);
  const keySession = `train-session-${dateKey}`;
  const keyNotes   = `train-notes-${dateKey}`;
  let savedSession = '', savedNotes = '';
  try { savedSession = localStorage.getItem(keySession) || ''; } catch(e){}
  try { savedNotes   = localStorage.getItem(keyNotes)   || ''; } catch(e){}

  return `
    <div class="training-detail">
      <h4>${cfg.session.toUpperCase()} · ${d.getDate()} ${MONTHS_CAP[d.getMonth()]}</h4>
      <div class="training-block" style="background:transparent;border:none;padding:0;margin-bottom:10px">
        <div class="training-block-label" style="color:var(--fg3);margin-bottom:6px">Sesión</div>
        <textarea class="train-textarea" id="ts-${dateKey}" placeholder="Anota tu entreno aquí… series, cargas, tiempos…" rows="4">${savedSession}</textarea>
        <div class="train-saved" id="tss-${dateKey}">✓ Guardado</div>
      </div>
      <div class="training-block" style="background:transparent;border:none;padding:0">
        <div class="training-block-label" style="color:var(--fg3);margin-bottom:6px">Notas</div>
        <textarea class="train-textarea" id="tn-${dateKey}" placeholder="Sensaciones, RPE, qué mejorar…" rows="3">${savedNotes}</textarea>
        <div class="train-saved" id="tns-${dateKey}">✓ Guardado</div>
      </div>
    </div>
  `;
}

function attachTrainListeners(dateKey) {
  const tsEl  = document.getElementById(`ts-${dateKey}`);
  const tnEl  = document.getElementById(`tn-${dateKey}`);
  const tssEl = document.getElementById(`tss-${dateKey}`);
  const tnsEl = document.getElementById(`tns-${dateKey}`);
  if (!tsEl || !tnEl) return;

  let timerS, timerN;
  tsEl.addEventListener('input', () => {
    clearTimeout(timerS);
    timerS = setTimeout(() => {
      try { localStorage.setItem(`train-session-${dateKey}`, tsEl.value); } catch(e){}
      tssEl.classList.add('show');
      setTimeout(()=>tssEl.classList.remove('show'), 1500);
    }, 600);
  });
  tnEl.addEventListener('input', () => {
    clearTimeout(timerN);
    timerN = setTimeout(() => {
      try { localStorage.setItem(`train-notes-${dateKey}`, tnEl.value); } catch(e){}
      tnsEl.classList.add('show');
      setTimeout(()=>tnsEl.classList.remove('show'), 1500);
    }, 600);
  });
}

// ── TAB SWITCH ──
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabTrain').classList.toggle('active', tab==='train');
  document.getElementById('tabNutri').classList.toggle('active', tab==='nutri');
  document.getElementById('hydroLegend').style.display = tab==='nutri' ? 'flex' : 'none';
  renderDays();
}

// ── INIT ──
function init() {
  updateCountdown();
  buildWeekNav();
  // select current week or plan start
  const ws = weekStart(TODAY);
  const target = inPlan(TODAY) ? ws : PLAN_START;
  currentWeekStart = weekStart(target);
  // find and activate pill
  const pills = document.querySelectorAll('.week-pill');
  const targetIdx = Math.floor((currentWeekStart - PLAN_START)/86400000/7);
  const activePill = pills[targetIdx];
  if (activePill) {
    activePill.classList.add('active');
    setTimeout(()=>activePill.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}),200);
  }
  switchTab('nutri');
}

init();

// ── SERVICE WORKER (offline) ──
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'hyrox-v1';
const FONTS = [
  'https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap'
];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(FONTS).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).then(res => {
      if (res && res.status === 200 && e.request.url.startsWith('https://fonts.')) {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return res;
    }).catch(() => caches.match(e.request)))
  );
});
  `;
  const blob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, {scope: './'}).catch(()=>{});
}
</script>
